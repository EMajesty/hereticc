[package]
name = "neurogenic-device-native-grid"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
description = "Feature-gated M0.5a Step Edit native grid experiment"

[lib]
crate-type = ["cdylib"]

[dependencies]
mpc-sample-sdk = { git = "https://github.com/ioma8/mpc-sample-sdk", rev = "9487cbba3648afb29d8e3107e31a7ac930985220" }
neurogenic-device = { path = "../neurogenic-device", default-features = false, features = ["native-playable-grid"] }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
