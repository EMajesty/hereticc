[package]
name = "neurogenic-device-hil"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
description = "Test-only MPC Sample build of the NEUROGENIC device mod"

[lib]
crate-type = ["cdylib"]

[dependencies]
mpc-sample-sdk = { git = "https://github.com/ioma8/mpc-sample-sdk", rev = "9487cbba3648afb29d8e3107e31a7ac930985220" }
neurogenic-device = { path = "../neurogenic-device", default-features = false, features = ["hil-test-interface"] }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
