[package]
name = "neurogenic-m06d-transport-hil"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
description = "Read-only M0.6d native transport observation experiment"

[lib]
crate-type = ["cdylib"]

[dependencies]
mpc-sample-sdk = { git = "https://github.com/ioma8/mpc-sample-sdk", rev = "9487cbba3648afb29d8e3107e31a7ac930985220" }
neurogenic-device = { path = "../../../crates/neurogenic-device", default-features = false, features = ["hil-test-interface", "transport-observer"] }

[workspace]

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
