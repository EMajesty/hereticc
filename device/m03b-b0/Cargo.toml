[package]
name = "hereticc-m03b-b0-input-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "=0.2.191"
mpc-sample-sdk = { path = "../../target/m03b-b0/sdk", default-features = false, features = ["selective-input-probe"] }

[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
