[workspace]
members = [
    "crates/neurogenic-b1-collector-model",
    "crates/neurogenic-b1-collector-linux",
    "crates/neurogenic-b1-relay-model",
    "crates/neurogenic-core",
    "crates/neurogenic-host",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
